<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<title>Braden &amp; Kat: 30 Days</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ctext y='.9em' font-size='90'%3E%F0%9F%90%A8%3C/text%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Caveat:wght@600;700&family=Fredoka:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="styles.css">
<link rel="stylesheet" href="mascots.css">
<link rel="stylesheet" href="grove.css">
</head>
<body>
<div id="grove-bg" aria-hidden="true"></div>
<canvas id="fx-canvas" aria-hidden="true"></canvas>

<header class="top">
  <div class="top-inner">
    <div class="eyebrow" id="cd-label">Loading…</div>
    <div class="countdown" id="countdown" aria-live="off"></div>
    <div class="daypill" id="daypill"></div>
  </div>
</header>

<main id="app" class="wrap"></main>

<div id="who-modal" class="modal" hidden>
  <div class="modal-card">
    <h2>Who's this? 🐨</h2>
    <p>Pick once and this device will remember.</p>
    <div class="who-buttons">
      <button data-who="braden" class="who-btn braden">Braden</button>
      <button data-who="kat" class="who-btn kat">Kat</button>
    </div>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.js"></script>
<script src="config.js"></script>
<script src="mascots.js"></script>
<script src="fx.js"></script>
<script src="grove.js"></script>
<script src="app.js"></script>
</body>
</html>
